services:
  - type: web
    name: mindscan-backend
    env: docker
    plan: free
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_API_URL
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
